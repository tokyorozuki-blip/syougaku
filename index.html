    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultInitialState;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return defaultInitialState;
        
        return {
          ...defaultInitialState,
          ...parsed,
          students: {
            minato: { ...defaultInitialState.students.minato, ...(parsed.students?.minato || {}) },
            yuzu: { ...defaultInitialState.students.yuzu, ...(parsed.students?.yuzu || {}) }
          }
        };
      } catch (err) {
        return defaultInitialState;
      }
    }

    function saveStateToStorage(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {}
    }

    function normalizeNumber(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xfee0))
                .replace(/．/g, '.')
                .trim();
    }

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() { return { hasError: true }; }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary:', error, errorInfo);
      }
      handleReset = () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        window.location.reload();
      };
      render() {
        if (this.state.hasError) {
          return (
            <div className="error-fallback-container">
              <h2 style={{ color: 'var(--color-danger)', fontSize: '1.4rem' }}>⚠️ 予期しない問題が発生しました</h2>
              <p style={{ color: 'var(--color-text-sub)', fontSize: '0.95rem' }}>
                画面描画を復旧させるため、安全にデータを初期化して再起動します。
              </p>
              <button className="btn btn-primary" onClick={this.handleReset} style={{ margin: '10px auto' }}>
                🔄 キャッシュをクリアして再起動
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function OkayamaChujuApp() {
      const [appState, setAppState] = useState(loadSavedState);
      const [syncInputCode, setSyncInputCode] = useState('');
      const [parentPinInput, setParentPinInput] = useState('');
      const [parentUnlocked, setParentUnlocked] = useState(false);
      const [quizActive, setQuizActive] = useState(false);
      const [activeQuizQuestions, setActiveQuizQuestions] = useState([]);
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [userAnswerInput, setUserAnswerInput] = useState('');
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [isAnswerCorrect, setIsAnswerCorrect] = useState(false);
      const [quizResult, setQuizResult] = useState(null);
      const isRemoteUpdate = useRef(false);

      // LocalStorage 自動保存 ＆ Firebase クラウド同期
      useEffect(() => {
        saveStateToStorage(appState);

        // クラウドへプッシュ（リモートからの自動更新時は再送信しない）
        if (firebaseDb && appState.familySyncCode && !isRemoteUpdate.current) {
          const cleanCode = appState.familySyncCode.trim().toLowerCase().replace(/[^a-z0-9_\-]/g, '');
          if (cleanCode) {
            firebaseDb.ref('rooms/' + cleanCode).set(appState).catch(err => {
              console.warn('Firebase sync notice:', err);
            });
          }
        }
        isRemoteUpdate.current = false;
      }, [appState]);

      // Firebase リアルタイムリスナー（他端末からの変更を1秒未満で即時反映）
      useEffect(() => {
        if (!firebaseDb || !appState.familySyncCode) return;
        const cleanCode = appState.familySyncCode.trim().toLowerCase().replace(/[^a-z0-9_\-]/g, '');
        if (!cleanCode) return;

        const roomRef = firebaseDb.ref('rooms/' + cleanCode);
        const handleSnapshot = (snapshot) => {
          const data = snapshot.val();
          if (data && typeof data === 'object') {
            isRemoteUpdate.current = true;
            setAppState(prev => ({
              ...prev,
              ...data,
              students: {
                minato: { ...prev.students.minato, ...(data.students?.minato || {}) },
                yuzu: { ...prev.students.yuzu, ...(data.students?.yuzu || {}) }
              }
            }));
          }
        };

        roomRef.on('value', handleSnapshot);
        return () => roomRef.off('value', handleSnapshot);
      }, [appState.familySyncCode]);

      const activeProfile = appState.students[appState.activeProfileId];
      const isMinato = appState.activeProfileId === 'minato';

      useEffect(() => {
        document.body.className = isMinato ? 'theme-minato' : 'theme-yuzu';
      }, [isMinato]);

      const handleSwitchProfile = (profId) => {
        setAppState(prev => ({
          ...prev,
          activeProfileId: profId,
          activeGrade: profId === 'minato' ? '1' : '4',
          showFurigana: profId === 'minato' ? true : prev.showFurigana
        }));
      };

      const rewardStudent = (amountEarned, expGained = 20) => {
        setAppState(prev => {
          const currentStud = prev.students[prev.activeProfileId];
          const newWallet = currentStud.wallet + amountEarned;
          const newTotalEarned = currentStud.totalEarned + amountEarned;
          const newExp = currentStud.exp + expGained;
          const newLevel = Math.floor(newExp / 100) + 1;
          const newStep = Math.min(50, currentStud.step + Math.floor(expGained / 20));

          let newUnusedTickets = currentStud.unusedTickets;
          if (Math.floor(newWallet / 100) > Math.floor(currentStud.wallet / 100)) {
            newUnusedTickets += 1;
          }

          return {
            ...prev,
            students: {
              ...prev.students,
              [prev.activeProfileId]: {
                ...currentStud,
                wallet: newWallet,
                totalEarned: newTotalEarned,
                exp: newExp,
                level: newLevel,
                step: newStep,
                unusedTickets: newUnusedTickets
              }
            }
          };
        });
      };

      const startDrillCategory = (subjectFilter) => {
        let filtered = SAMPLE_QUESTIONS.filter(q => {
          if (subjectFilter === 'all') return true;
          if (subjectFilter === 'aptitude') return q.subject === 'aptitude';
          return q.subject === subjectFilter;
        });

        if (filtered.length === 0) filtered = SAMPLE_QUESTIONS;

        setActiveQuizQuestions(filtered);
        setCurrentQIndex(0);
        setUserAnswerInput('');
        setSelectedChoice(null);
        setQuizSubmitted(false);
        setIsAnswerCorrect(false);
        setQuizResult(null);
        setQuizActive(true);
      };

      const handleCheckAnswer = () => {
        if (quizSubmitted) return;
        const currentQ = activeQuizQuestions[currentQIndex];
        let correct = false;

        if (currentQ.type === 'choice') {
          correct = selectedChoice === currentQ.correctAnswer;
        } else if (currentQ.type === 'numeric') {
          correct = normalizeNumber(userAnswerInput) === normalizeNumber(currentQ.correctAnswer);
        } else if (currentQ.type === 'essay') {
          correct = userAnswerInput.trim().length >= 4;
        }

        setQuizSubmitted(true);
        setIsAnswerCorrect(correct);
        if (correct) rewardStudent(10, 25);
      };

      const handleNextQuestion = () => {
        if (currentQIndex < activeQuizQuestions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
          setUserAnswerInput('');
          setSelectedChoice(null);
          setQuizSubmitted(false);
          setIsAnswerCorrect(false);
        } else {
          if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          setQuizResult({ total: activeQuizQuestions.length, earned: activeQuizQuestions.length * 10 });
        }
      };

      const handleSetFamilySyncCode = (e) => {
        e.preventDefault();
        const clean = syncInputCode.trim();
        if (!clean) return;
        setAppState(prev => ({ ...prev, familySyncCode: clean }));
        alert(`☁️ あいことば「${clean}」でクラウドリアルタイム同期を開始しました！`);
      };

      const handleUnlockParent = (e) => {
        e.preventDefault();
        if (parentPinInput === appState.parentPin) setParentUnlocked(true);
        else alert('暗証番号が異なります（初期番号：0410）');
      };

      return (
        <div className="app-viewport">
          <header className="card-large main-header">
            <div className="header-top-row">
              <div className="app-brand">
                <div className="brand-icon">🎒</div>
                <div>
                  <h1 className="brand-title">岡山中受ナビ</h1>
                  <span className="brand-sub">操山中・大安寺中等受検 ＆ 小学生教科学習</span>
                </div>
              </div>

              {/* クラウド同期ステータス ＆ 受講者切替 */}
              <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                <span className="badge" style={{ background: appState.familySyncCode ? '#e6fffa' : '#f1f5f9', color: appState.familySyncCode ? '#047857' : '#64748b', border: '1px solid #cbd5e1' }}>
                  ☁️ {appState.familySyncCode ? `同期中: ${appState.familySyncCode}` : 'ローカル動作用'}
                </span>

                <button
                  className={`btn ${appState.activeProfileId === 'minato' ? 'btn-primary' : 'btn-secondary'}`}
                  onClick={() => handleSwitchProfile('minato')}
                  style={{ borderRadius: '999px', padding: '6px 16px' }}
                >
                  👧 みなとちゃん（小1）
                </button>
                <button
                  className={`btn ${appState.activeProfileId === 'yuzu' ? 'btn-primary' : 'btn-secondary'}`}
                  onClick={() => handleSwitchProfile('yuzu')}
                  style={{ borderRadius: '999px', padding: '6px 16px' }}
                >
                  👧 ゆずちゃん（小4）
                </button>
              </div>
            </div>

            <div className="nav-menu-bar">
              {[
                { id: 'home', label: '🏠 ホーム' },
                { id: 'advance', label: '🚀 先取り' },
                { id: 'math', label: '📐 算数・筆算' },
                { id: 'kanji', label: '✏️ 漢字・国語' },
                { id: 'progress', label: '📊 進捗・お財布' },
                { id: 'guide', label: '📖 志望校ガイド' },
                { id: 'parent', label: '🔒 保護者エリア' }
              ].map(m => (
                <button
                  key={m.id}
                  className={`nav-menu-item ${appState.activeTab === m.id ? 'active' : ''}`}
                  onClick={() => { setAppState(prev => ({ ...prev, activeTab: m.id })); setQuizActive(false); }}
                >
                  {m.label}
                </button>
              ))}
            </div>
          </header>

          {quizActive ? (
            <div className="card-large" style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              {!quizResult ? (
                <>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span className="badge" style={{ background: 'var(--primary-bg)', color: 'var(--primary)' }}>
                      問題 {currentQIndex + 1} / {activeQuizQuestions.length}
                    </span>
                    <button className="btn btn-secondary" onClick={() => setQuizActive(false)}>演習をやめる</button>
                  </div>

                  <h3 style={{ fontSize: '1.25rem', fontWeight: '900' }}>
                    <FuriganaText text={activeQuizQuestions[currentQIndex]?.rubiedTitle || activeQuizQuestions[currentQIndex]?.title} showFurigana={appState.showFurigana} />
                  </h3>

                  <div style={{ background: '#ffffff', padding: '16px', borderRadius: '18px', border: '1.5px solid #e2e8f0' }}>
                    <FuriganaText text={activeQuizQuestions[currentQIndex]?.rubiedQuestion || activeQuizQuestions[currentQIndex]?.question} showFurigana={appState.showFurigana} />
                    <DiagramViewer type={activeQuizQuestions[currentQIndex]?.diagram} />
                  </div>

                  {activeQuizQuestions[currentQIndex]?.type === 'choice' && (
                    <div style={{ display: 'grid', gap: '10px' }}>
                      {activeQuizQuestions[currentQIndex].options.map((opt, idx) => (
                        <button
                          key={idx}
                          className={`btn ${selectedChoice === opt ? 'btn-primary' : 'btn-secondary'}`}
                          onClick={() => setSelectedChoice(opt)}
                          disabled={quizSubmitted}
                          style={{ justifyContent: 'flex-start', textAlign: 'left' }}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  )}

                  {activeQuizQuestions[currentQIndex]?.type === 'numeric' && (
                    <div>
                      <label style={{ fontSize: '0.9rem', fontWeight: 'bold', display: 'block', marginBottom: '6px' }}>
                        数字を入力（全角数字でもOK）:
                      </label>
                      <input
                        type="text"
                        inputMode="numeric"
                        className="card-std"
                        style={{ width: '100%', fontSize: '1.4rem', fontWeight: '900', textAlign: 'center' }}
                        value={userAnswerInput}
                        onChange={(e) => setUserAnswerInput(e.target.value)}
                        placeholder="例: 823 または ８２３"
                        disabled={quizSubmitted}
                      />
                    </div>
                  )}

                  {activeQuizQuestions[currentQIndex]?.type === 'essay' && (
                    <div>
                      <textarea
                        className="card-std"
                        style={{ width: '100%', height: '100px', fontSize: '1rem' }}
                        value={userAnswerInput}
                        onChange={(e) => setUserAnswerInput(e.target.value)}
                        placeholder="理由や自分の考えを書いてみよう！"
                        disabled={quizSubmitted}
                      />
                    </div>
                  )}

                  {!quizSubmitted ? (
                    <button className="btn btn-primary" onClick={handleCheckAnswer} style={{ marginTop: '10px' }}>
                      答え合わせする
                    </button>
                  ) : (
                    <div style={{ background: isAnswerCorrect ? '#e6fffa' : '#fff5f5', padding: '16px', borderRadius: '16px', border: `2px solid ${isAnswerCorrect ? '#10b981' : '#ef4444'}` }}>
                      <h4 style={{ color: isAnswerCorrect ? '#047857' : '#b91c1c', fontSize: '1.2rem' }}>
                        {isAnswerCorrect ? '🎉 大正解！ (+10円＆25EXP獲得)' : '惜しい！ 解答を確認しよう'}
                      </h4>
                      <p style={{ marginTop: '6px', fontWeight: 'bold' }}>
                        【解説】{activeQuizQuestions[currentQIndex]?.explanation}
                      </p>
                      <button className="btn btn-primary" onClick={handleNextQuestion} style={{ marginTop: '12px' }}>
                        {currentQIndex < activeQuizQuestions.length - 1 ? '次の問題へ ➔' : '結果を見る 🏆'}
                      </button>
                    </div>
                  )}
                </>
              ) : (
                <div style={{ textAlign: 'center', display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <h2 style={{ fontSize: '1.8rem', color: 'var(--primary)' }}>🏆 おめでとう！演習完了！</h2>
                  <p style={{ fontSize: '1.2rem', fontWeight: '800' }}>
                    獲得したお小遣い: <span style={{ color: 'var(--color-accent)', fontSize: '1.6rem' }}>+{quizResult.earned}円</span>
                  </p>
                  <button className="btn btn-primary" onClick={() => setQuizActive(false)} style={{ margin: '0 auto' }}>
                    ホームへ戻る
                  </button>
                </div>
              )}
            </div>
          ) : (
            <>
              {appState.activeTab === 'home' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  <div className="card-large" style={{ borderLeft: '6px solid var(--primary)' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '16px', flexWrap: 'wrap' }}>
                      <div style={{ fontSize: '3.5rem' }}>{activeProfile.avatar}</div>
                      <div>
                        <h2 style={{ fontSize: '1.5rem', fontWeight: '900' }}>{activeProfile.name} の学習部屋</h2>
                        <span className="badge" style={{ background: 'var(--primary)', color: '#ffffff' }}>
                          {activeProfile.gradeStr}
                        </span>
                      </div>
                    </div>

                    <div style={{ marginTop: '16px', background: '#ffffff', padding: '14px', borderRadius: '16px', border: '1px dashed #cbd5e1' }}>
                      <strong style={{ color: 'var(--primary)' }}>💬 保護者からの応援メッセージ:</strong>
                      <p style={{ marginTop: '4px', fontWeight: '700' }}>{appState.parentMessage}</p>
                    </div>
                  </div>

                  <div className="card-large" style={{ background: 'linear-gradient(135deg, #ffffff 0%, var(--primary-bg) 100%)' }}>
                    <h3 style={{ fontSize: '1.3rem', color: 'var(--primary)', fontWeight: '900' }}>🎯 今日の学習目標</h3>
                    <p style={{ marginTop: '6px', fontWeight: '700' }}>
                      {isMinato ? '【小1基礎】ひらがなルビ付き問題で、楽しく足し算とことばを学ぼう！' : '【小4先取り＆適性検査】筆算と操山中・大安寺中等の思考力ドリルに挑戦しよう！'}
                    </p>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '16px' }}>
                    <div className="card-large card-hoverable" style={{ borderTop: '5px solid var(--color-minato)', cursor: 'pointer' }} onClick={() => { handleSwitchProfile('minato'); startDrillCategory('all'); }}>
                      <h3 style={{ fontSize: '1.3rem', color: 'var(--color-minato)' }}>🌸 みなとちゃんの部屋</h3>
                      <p style={{ fontSize: '0.9rem', color: 'var(--color-text-sub)', marginTop: '4px' }}>小学1年生向け・ひらがなルビ・基礎計算・楽しく学べるドリル</p>
                      <button className="btn btn-primary" style={{ background: 'var(--color-minato)', marginTop: '14px' }}>ドリルをはじめる ➔</button>
                    </div>

                    <div className="card-large card-hoverable" style={{ borderTop: '5px solid var(--color-yuzu)', cursor: 'pointer' }} onClick={() => { handleSwitchProfile('yuzu'); startDrillCategory('all'); }}>
                      <h3 style={{ fontSize: '1.3rem', color: 'var(--color-yuzu)' }}>💜 ゆずちゃんの部屋</h3>
                      <p style={{ fontSize: '0.9rem', color: 'var(--color-text-sub)', marginTop: '4px' }}>小学4年生向け・小4先取り・筆算・思考力問題・適性検査準備</p>
                      <button className="btn btn-primary" style={{ background: 'var(--color-yuzu)', marginTop: '14px' }}>特訓を開始する ➔</button>
                    </div>
                  </div>

                  <div className="card-large">
                    <h3 style={{ fontSize: '1.2rem', fontWeight: '900' }}>🗺️ 50ステップ宝島ロードマップ</h3>
                    <p style={{ fontSize: '0.9rem', color: 'var(--color-text-sub)' }}>現在のステップ: Step {activeProfile.step} / 50 (Level {activeProfile.level})</p>
                    <div style={{ width: '100%', height: '14px', background: '#e2e8f0', borderRadius: '999px', marginTop: '10px', overflow: 'hidden' }}>
                      <div style={{ width: `${(activeProfile.exp % 100)}%`, height: '100%', background: 'var(--primary)' }}></div>
                    </div>
                  </div>

                  <div className="card-large card-hoverable" style={{ background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)', color: '#ffffff' }} onClick={() => startDrillCategory('aptitude')}>
                    <span className="badge" style={{ background: '#f59e0b', color: '#0f172a' }}>岡山公立中高一貫校</span>
                    <h3 style={{ fontSize: '1.5rem', marginTop: '8px', color: '#38bdf8' }}>🎓 適性検査 思考力・記述特訓</h3>
                    <p style={{ fontSize: '0.95rem', color: '#cbd5e1', marginTop: '4px' }}>
                      岡山県立操山中学校 ＆ 岡山県立大安寺中等教育学校の適性検査（資料読み取り・論理思考・文章記述）対策！
                    </p>
                    <button className="btn" style={{ background: '#38bdf8', color: '#0f172a', fontWeight: '900', marginTop: '16px' }}>
                      思考力チャレンジを開始 ➔
                    </button>
                  </div>
                </div>
              )}

              {appState.activeTab === 'math' && (
                <div className="card-large" style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <h2 style={{ color: 'var(--primary)' }}>📐 算数・筆算ドリル</h2>
                  <p>基礎計算から小4の筆算、応用文章題までマスターしよう！</p>
                  <button className="btn btn-primary" onClick={() => startDrillCategory('math')}>算数ドリルをスタート！</button>
                </div>
              )}

              {appState.activeTab === 'kanji' && (
                <div className="card-large" style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <h2 style={{ color: 'var(--primary)' }}>✏️ 漢字・国語ドリル</h2>
                  <p>学年ごとの読み・書き、同音異義語、語彙力を鍛えよう！</p>
                  <button className="btn btn-primary" onClick={() => startDrillCategory('japanese')}>国語ドリルをスタート！</button>
                </div>
              )}

              {appState.activeTab === 'progress' && (
                <div className="card-large" style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  <h2>💰 {activeProfile.name} のお財布・貯金通帳</h2>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '12px' }}>
                    <div className="card-std" style={{ background: '#fef3c7', border: '1.5px solid #f59e0b' }}>
                      <span style={{ fontSize: '0.85rem', fontWeight: 'bold' }}>現在の貯金額</span>
                      <p style={{ fontSize: '1.8rem', fontWeight: '900', color: '#b45309' }}>{activeProfile.wallet} 円</p>
                    </div>
                    <div className="card-std">
                      <span style={{ fontSize: '0.85rem', fontWeight: 'bold' }}>未使用お小遣いチケット</span>
                      <p style={{ fontSize: '1.8rem', fontWeight: '900', color: 'var(--primary)' }}>🎟️ {activeProfile.unusedTickets} 枚</p>
                    </div>
                  </div>
                </div>
              )}

              {appState.activeTab === 'guide' && (
                <div className="card-large" style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <h2>📖 岡山市 公立中高一貫校 志望校ガイド</h2>
                  <div className="card-std">
                    <h3 style={{ color: 'var(--color-blue)' }}>🏫 岡山県立操山中学校</h3>
                    <p style={{ fontSize: '0.95rem', marginTop: '6px' }}>豊かな自然と歴史ある操山の環境で、高い論理的思考力と表現力を養う伝統校です。</p>
                  </div>
                  <div className="card-std">
                    <h3 style={{ color: 'var(--color-teal)' }}>🏫 岡山県立大安寺中等教育学校</h3>
                    <p style={{ fontSize: '0.95rem', marginTop: '6px' }}>6年間の一貫教育でグローバルリーダーを育てる、国際理解と適性検査対策が充実した進学校です。</p>
                  </div>
                </div>
              )}

              {appState.activeTab === 'parent' && (
                <div className="card-large">
                  <h2>🔒 保護者専用エリア</h2>
                  {!parentUnlocked ? (
                    <form onSubmit={handleUnlockParent} style={{ marginTop: '16px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      <label style={{ fontWeight: 'bold' }}>暗証番号を入力してください（初期: 0410）:</label>
                      <input
                        type="password"
                        className="card-std"
                        style={{ width: '200px', fontSize: '1.2rem', textAlign: 'center' }}
                        value={parentPinInput}
                        onChange={(e) => setParentPinInput(e.target.value)}
                      />
                      <button type="submit" className="btn btn-primary" style={{ width: '200px' }}>ロック解除</button>
                    </form>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '20px', marginTop: '16px' }}>
                      {/* クラウド自動同期・あいことば設定 */}
                      <div className="card-std" style={{ background: '#f0fdf4', border: '1.5px solid #10b981' }}>
                        <h3 style={{ color: '#047857' }}>☁️ クラウド自動同期（マルチデバイス共有）設定</h3>
                        <p style={{ fontSize: '0.88rem', color: '#065f46', marginTop: '4px' }}>
                          スマホ・タブレット・PCで「同じあいことば（例：okayama-family）」を設定すると、1秒未満で自動同期されます！
                        </p>
                        <form onSubmit={handleSetFamilySyncCode} style={{ display: 'flex', gap: '10px', marginTop: '10px', flexWrap: 'wrap' }}>
                          <input
                            type="text"
                            className="card-std"
                            style={{ flex: 1, minWidth: '200px', padding: '10px 14px' }}
                            placeholder="例: okayama-2026"
                            value={syncInputCode}
                            onChange={(e) => setSyncInputCode(e.target.value)}
                          />
                          <button type="submit" className="btn btn-primary" style={{ background: '#10b981' }}>あいことばを登録</button>
                        </form>
                        {appState.familySyncCode && (
                          <p style={{ marginTop: '8px', fontSize: '0.85rem', fontWeight: 'bold', color: '#047857' }}>
                            現在のあいことば: 「{appState.familySyncCode}」
                          </p>
                        )}
                      </div>

                      <div className="card-std">
                        <h3>💬 子どもへの応援メッセージ変更</h3>
                        <input
                          type="text"
                          className="card-std"
                          style={{ width: '100%', marginTop: '8px' }}
                          value={appState.parentMessage}
                          onChange={(e) => setAppState(prev => ({ ...prev, parentMessage: e.target.value }))}
                        />
                      </div>
                      <button className="btn btn-secondary" onClick={() => setParentUnlocked(false)}>保護者エリアを施錠</button>
                    </div>
                  )}
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <OkayamaChujuApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
