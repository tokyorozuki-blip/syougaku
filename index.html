  <style>
    /* ----------------------------------------------------
       岡山中受ナビ - デザインシステム & レスポンシブCSS
       ---------------------------------------------------- */
    :root {
      --font-main: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
      --font-number: 'Plus Jakarta Sans', var(--font-main);

      /* カラー定義 */
      --color-blue: #2563eb;
      --color-teal: #0d9488;
      
      /* 受講者カラー */
      --color-minato: #ec4899;
      --bg-minato: #fdf2f8;
      
      --color-yuzu: #8b5cf6;
      --bg-yuzu: #f3e8ff;

      --color-accent: #f59e0b;
      --bg-accent: #fef3c7;

      /* アクティブテーマ (デフォルト：ブルー) */
      --primary: var(--color-blue);
      --primary-bg: #eff6ff;
      --primary-border: rgba(37, 99, 235, 0.2);

      --color-text-main: #1e293b;
      --color-text-sub: #64748b;
      --color-success: #10b981;
      --color-danger: #ef4444;

      /* 角丸ルールの徹底 */
      --radius-card: 20px;
      --radius-large-card: 28px;
      --radius-btn: 16px;

      /* ガラスマフィズムとシャドウ */
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.6);
      --shadow-glass: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 16px 36px -4px rgba(0, 0, 0, 0.09), 0 6px 16px rgba(0, 0, 0, 0.04);

      /* タッチ操作 & iOS セーフエリア */
      --min-tap: 48px;
      --safe-bottom: max(16px, env(safe-area-inset-bottom, 16px));
    }

    body.theme-minato {
      --primary: var(--color-minato);
      --primary-bg: var(--bg-minato);
      --primary-border: rgba(236, 72, 153, 0.25);
    }
    body.theme-yuzu {
      --primary: var(--color-yuzu);
      --primary-bg: var(--bg-yuzu);
      --primary-border: rgba(139, 92, 246, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-main);
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      background-attachment: fixed;
      color: var(--color-text-main);
      line-height: 1.6;
      font-size: 16px;
    }

    ruby { ruby-position: over; }
    rt { font-size: 0.65em; font-weight: 800; user-select: none; }
    body.theme-minato rt { color: var(--color-minato); }
    body.theme-yuzu rt { color: var(--color-blue); }

    .app-viewport {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: calc(var(--safe-bottom) + 90px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.4s ease-out;
    }

    .card-std {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-card);
      border: 1.5px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
      padding: 20px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-large {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-large-card);
      border: 1.5px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
      padding: 26px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-hoverable:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .btn {
      min-height: var(--min-tap);
      min-width: var(--min-tap);
      padding: 12px 22px;
      border-radius: var(--radius-btn);
      border: none;
      font-family: var(--font-main);
      font-weight: 800;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }
    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary {
      background: #ffffff;
      color: var(--color-text-main);
      border: 1.5px solid rgba(0, 0, 0, 0.1);
    }
    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-fallback-container {
      max-width: 500px;
      margin: 60px auto;
      padding: 32px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      text-align: center;
      display: flex;
      flex-direction: column;

    .header-top-row {

      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;

    .app-brand {

      align-items: center;
      gap: 12px;

    .brand-icon {

      height: 46px;

      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;

    .brand-sub {

      history: [],
      customQuestions: []

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultInitialState;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return defaultInitialState;
        
        return {
          ...defaultInitialState,
          ...parsed,
          wrongQuestions: {
            minato: parsed.wrongQuestions?.minato || defaultInitialState.wrongQuestions.minato,
            yuzu: parsed.wrongQuestions?.yuzu || defaultInitialState.wrongQuestions.yuzu
          },
          students: {
            minato: { ...defaultInitialState.students.minato, ...(parsed.students?.minato || {}) },
            yuzu: { ...defaultInitialState.students.yuzu, ...(parsed.students?.yuzu || {}) }
          }
        };
      } catch (err) {
        return defaultInitialState;
      }
    }

    function saveStateToStorage(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {}
    }

    function normalizeNumber(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xfee0))
                .replace(/．/g, '.')
                .trim();
    }

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() { return { hasError: true }; }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary:', error, errorInfo);
      }
      handleReset = () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        window.location.reload();
      };
      render() {
        if (this.state.hasError) {
          return (
            <div className="error-fallback-container">
              <h2 style={{ color: 'var(--color-danger)', fontSize: '1.4rem' }}>⚠️ 予期しない問題が発生しました</h2>
              <p style={{ color: 'var(--color-text-sub)', fontSize: '0.95rem' }}>
                画面描画を復旧させるため、安全にデータを初期化して再起動します。
              </p>
              <button className="btn btn-primary" onClick={this.handleReset} style={{ margin: '10px auto' }}>
                🔄 キャッシュをクリアして再起動
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

        rubiedTitle: '【<ruby>操山<rt>みさおやま</rt></ruby>・<ruby>大安寺<rt>だいあんじ</rt></ruby>】<ruby>条件<rt>じょうけん</rt></ruby><ruby>整理<rt>せいり</rt></ruby>',
        question: 'A・B・C・Dの4人が月〜木に1日ずつ図書当番をします。【条件1: 月曜はBさん】【条件2: DさんはAさんの直後の日】【条件3: Cさんは木曜ではない】水曜日の当番はだれでしょう？',
        type: 'choice',
        options: ['Aさん', 'Bさん', 'Cさん', 'Dさん'],
        correctAnswer: 'Aさん',
        explanation: '月＝B。木はCではないので木＝D、水＝A、火＝C となり、水曜日の当番は Aさん です！'
      },
      {
        id: 'q_apt4',
        subject: 'aptitude',
        grade: '4',
        title: '【操山中・大安寺中等】マッチ棒の規則性（適性検査Ⅰ）',
        rubiedTitle: '【<ruby>操山<rt>みさおやま</rt></ruby>・<ruby>大安寺<rt>だいあんじ</rt></ruby>】<ruby>規則性<rt>きそくせい</rt></ruby>パズル',
        question: 'マッチ棒で横一列に正方形を作ります。1個＝4本、2個＝7本、3個＝10本。正方形を10個つなげて作るとマッチ棒は何本必要ですか？',
        type: 'choice',
        options: ['30本', '31本', '34本', '40本'],
        correctAnswer: '31本',
        explanation: '規則性： 最初の1本 ＋ (正方形の数 × 3本)。 1 + (10 × 3) = 31本 になります！'
      }
    ];

    function OkayamaChujuApp() {
      const [appState, setAppState] = useState(loadSavedState);
      const [syncInputCode, setSyncInputCode] = useState('');
      const [parentPinInput, setParentPinInput] = useState('');
      const [parentUnlocked, setParentUnlocked] = useState(false);
      const [quizActive, setQuizActive] = useState(false);
      const [activeQuizQuestions, setActiveQuizQuestions] = useState([]);
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [userAnswerInput, setUserAnswerInput] = useState('');
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [isAnswerCorrect, setIsAnswerCorrect] = useState(false);
      const [quizResult, setQuizResult] = useState(null);
      const [showHint, setShowHint] = useState(false);
      const [selectedExplanationModal, setSelectedExplanationModal] = useState(null);
      const isRemoteUpdate = useRef(false);

      // LocalStorage 自動保存 ＆ Firebase クラウド同期
      useEffect(() => {
        saveStateToStorage(appState);

        // クラウドへプッシュ（リモートからの自動更新時は再送信しない）
        if (firebaseDb && appState.familySyncCode && !isRemoteUpdate.current) {
          const cleanCode = appState.familySyncCode.trim().toLowerCase().replace(/[^a-z0-9_\-]/g, '');
          if (cleanCode) {
            firebaseDb.ref('rooms/' + cleanCode).set(appState).catch(err => {
              console.warn('Firebase sync notice:', err);
            });
          }
        }
        isRemoteUpdate.current = false;
      }, [appState]);

      // Firebase リアルタイムリスナー（他端末からの変更を1秒未満で即時反映）
      useEffect(() => {
        if (!firebaseDb || !appState.familySyncCode) return;
        const cleanCode = appState.familySyncCode.trim().toLowerCase().replace(/[^a-z0-9_\-]/g, '');
        if (!cleanCode) return;

        const roomRef = firebaseDb.ref('rooms/' + cleanCode);
        const handleSnapshot = (snapshot) => {
          const data = snapshot.val();
          if (data && typeof data === 'object') {
            isRemoteUpdate.current = true;
            setAppState(prev => ({
              ...prev,
              ...data,
              students: {
                minato: { ...prev.students.minato, ...(data.students?.minato || {}) },
                yuzu: { ...prev.students.yuzu, ...(data.students?.yuzu || {}) }
              }
            }));
          }
        };

        roomRef.on('value', handleSnapshot);
        return () => roomRef.off('value', handleSnapshot);
      }, [appState.familySyncCode]);

      // ユーザー指定の学校カレンダー（学期＆長期休み）に基づくリアルタイム判定システム
      function getCurrentSchoolSemesterAndTerm(nowDate = new Date()) {
        const year = nowDate.getFullYear();
        const month = nowDate.getMonth() + 1; // 1〜12
        const day = nowDate.getDate();

        // 日本の学校年度（4月1日〜翌年3月31日＝1学年度）
        const schoolYear = month >= 4 ? year : year - 1;
        const diffYears = schoolYear - 2026;

        const minatoGradeNum = 1 + diffYears;
        const yuzuGradeNum = 4 + diffYears;

        const formatGrade = (num, extraNote = '') => {
          if (num <= 0) return `未就学 (${Math.abs(num) + 1}年後に入学)`;
          if (num <= 6) return `小学${num}年生${extraNote}`;
          if (num <= 9) return `中学${num - 6}年生${extraNote}`;
          if (num <= 12) return `高校${num - 9}年生${extraNote}`;
          return `卒業生 (${num - 12}年目)`;
        };

        // ユーザー指定の正確な学期・長期休み判定 logic:
        // 4月〜7月末: 1学期
        // 8月全日: 夏休み
        // 9月〜12月24日: 2学期
        // 12月25日〜1月10日: 冬休み
        // 1月10日〜3月20日: 3学期
        // 3月20日〜3月31日: 春休み

        let termKey = 'term1';
        let termLabel = '🏫 1学期';
        let termDesc = '1学期の学習中！基礎知識・単元概念のしっかりした定着を目指そう！';
        let seasonalTabRecommendation = 'summer';

        if (month >= 4 && month <= 7) {
          termKey = 'term1';
          termLabel = '🏫 1学期 (4月〜7月末)';
          termDesc = '1学期の学習中！基礎知識・単元概念のしっかりした定着を目指そう！';
          seasonalTabRecommendation = 'summer';
        } else if (month === 8) {
          termKey = 'summer_vacation';
          termLabel = '☀️ 夏休み (8月)';
          termDesc = '夏休み真っ最中！特別先取りドリルで一気に差をつけよう！';
          seasonalTabRecommendation = 'summer';
        } else if (month >= 9 && (month < 12 || (month === 12 && day <= 24))) {
          termKey = 'term2';
          termLabel = '🏫 2学期 (9月〜12月24日)';
          termDesc = '2学期の学習中！難度の上がる応用・筆算・適性検査演習にチャレンジ！';
          seasonalTabRecommendation = 'winter';
        } else if ((month === 12 && day >= 25) || (month === 1 && day <= 10)) {
          termKey = 'winter_vacation';
          termLabel = '❄️ 冬休み (12月25日〜1月10日)';
          termDesc = '冬休み中！今年1年の総復習と特別先取りドリルでレベルアップ！';
          seasonalTabRecommendation = 'winter';
        } else if ((month === 1 && day >= 10) || month === 2 || (month === 3 && day <= 20)) {
          termKey = 'term3';
          termLabel = '🏫 3学期 (1月10日〜3月20日)';
          termDesc = '3学期のまとめ！学年最後の総仕上げと次学年への飛躍！';
          seasonalTabRecommendation = 'spring';
        } else if (month === 3 && day > 20) {
          termKey = 'spring_vacation';
          termLabel = '🌸 春休み (3月20日〜3月31日)';
          termDesc = '春休み中！新学年に向けた特別先取りドリルでスタートダッシュ！';
          seasonalTabRecommendation = 'spring';
        }

        return {
          schoolYear,
          year,
          month,
          day,
          termKey,
          termLabel,
          termDesc,
          seasonalTabRecommendation,
          minato: {
            gradeNum: Math.max(1, minatoGradeNum),
            gradeStr: formatGrade(minatoGradeNum)
          },
          yuzu: {
            gradeNum: Math.max(1, yuzuGradeNum),
            gradeStr: formatGrade(yuzuGradeNum, yuzuGradeNum >= 7 ? ' (操山・大安寺合格！)' : (yuzuGradeNum >= 5 ? ' (操山・大安寺受検)' : ' (受検準備)'))
          }
        };
      }

      const liveGrades = getCurrentSchoolSemesterAndTerm();
      const rawProfile = appState.students[appState.activeProfileId];
      const isMinato = appState.activeProfileId === 'minato';

      const activeProfile = {
        ...rawProfile,
        gradeStr: isMinato ? liveGrades.minato.gradeStr : liveGrades.yuzu.gradeStr,
        gradeNum: isMinato ? liveGrades.minato.gradeNum : liveGrades.yuzu.gradeNum
      };

      useEffect(() => {
        document.body.className = isMinato ? 'theme-minato' : 'theme-yuzu';
      }, [isMinato]);

      const handleSwitchProfile = (profId) => {
        setAppState(prev => ({
          ...prev,
          activeProfileId: profId,
          activeGrade: profId === 'minato' ? '1' : '4',
          showFurigana: profId === 'minato' ? true : prev.showFurigana
        }));
      };

      const rewardStudent = (amountEarned, expGained = 20) => {
        setAppState(prev => {
          const currentStud = prev.students[prev.activeProfileId];
          const newWallet = currentStud.wallet + amountEarned;
          const newTotalEarned = currentStud.totalEarned + amountEarned;
          const newExp = currentStud.exp + expGained;
          const newLevel = Math.floor(newExp / 100) + 1;
          const newStep = Math.min(50, currentStud.step + Math.floor(expGained / 20));

          let newUnusedTickets = currentStud.unusedTickets;
          if (Math.floor(newWallet / 100) > Math.floor(currentStud.wallet / 100)) {
            newUnusedTickets += 1;
          }

          return {
            ...prev,
            students: {
              ...prev.students,
              [prev.activeProfileId]: {
                ...currentStud,
                wallet: newWallet,
                totalEarned: newTotalEarned,
                exp: newExp,
                level: newLevel,
                step: newStep,
                unusedTickets: newUnusedTickets
              }
            }
          };
        });
      };

      const getMasterQuestions = () => {
        return [
          ...SAMPLE_QUESTIONS,
          ...(appState.customQuestions || []),
          ...ALL_GENERATED_QUESTIONS.math,
          ...ALL_GENERATED_QUESTIONS.japanese,
          ...ALL_GENERATED_QUESTIONS.science,
          ...ALL_GENERATED_QUESTIONS.social,
          ...ALL_GENERATED_QUESTIONS.aptitude
        ];
      };

      const startDrillCategory = (subjectFilter, startQIndex = 0, gradeFilter = null, difficultyFilter = null) => {
        let master = getMasterQuestions();
        let filtered = master.filter(q => {
          const matchSub = subjectFilter === 'all' ? true : (subjectFilter === 'aptitude' ? q.subject === 'aptitude' : q.subject === subjectFilter);
          const matchGrade = gradeFilter ? (String(q.grade) === String(gradeFilter)) : true;
          const matchDiff = difficultyFilter ? (q.difficulty === difficultyFilter) : true;
          return matchSub && matchGrade && matchDiff;
        });

        if (filtered.length === 0) filtered = master;

        setActiveQuizQuestions(filtered);
        setCurrentQIndex(Math.min(startQIndex, filtered.length - 1));
        setUserAnswerInput('');
        setSelectedChoice(null);
        setQuizSubmitted(false);
        setIsAnswerCorrect(false);
        setShowHint(false);
        setQuizResult(null);
        setQuizActive(true);
      };

      const startRevengeDrill = () => {
        const wrongIds = appState.wrongQuestions[appState.activeProfileId] || [];
        let master = getMasterQuestions();
        let filtered = master.filter(q => wrongIds.includes(q.id));
        if (filtered.length === 0) {
          alert('🎉 現在、間違えた問題（リベンジ問題）はありません！全問正解中です！');
          return;
        }

        setActiveQuizQuestions(filtered);
        setCurrentQIndex(0);
        setUserAnswerInput('');
        setSelectedChoice(null);
        setQuizSubmitted(false);
        setIsAnswerCorrect(false);
        setShowHint(false);
        setQuizResult(null);
        setQuizActive(true);
      };

      const handleCheckAnswer = () => {
        if (quizSubmitted) return;
        const currentQ = activeQuizQuestions[currentQIndex];
        let correct = false;

        if (currentQ.type === 'choice') {
          correct = selectedChoice === currentQ.correctAnswer;
        } else if (currentQ.type === 'numeric') {
          correct = normalizeNumber(userAnswerInput) === normalizeNumber(currentQ.correctAnswer);
        } else if (currentQ.type === 'essay') {
          correct = userAnswerInput.trim().length >= 4;
        }

        setQuizSubmitted(true);
        setIsAnswerCorrect(correct);

        const activeId = appState.activeProfileId;
        const currentWrongList = appState.wrongQuestions[activeId] || [];

        if (correct) {
          rewardStudent(10, 25);
          // リベンジ成功：間違えたリストから削除
          if (currentWrongList.includes(currentQ.id)) {
            setAppState(prev => ({
              ...prev,
              wrongQuestions: {
                ...prev.wrongQuestions,
                [activeId]: (prev.wrongQuestions[activeId] || []).filter(id => id !== currentQ.id)
              }
            }));
          }
        } else {
          // 間違えた問題をリストに追加
          if (!currentWrongList.includes(currentQ.id)) {
            setAppState(prev => ({
              ...prev,
              wrongQuestions: {
                ...prev.wrongQuestions,
                [activeId]: [...(prev.wrongQuestions[activeId] || []), currentQ.id]
              }
            }));
          }
        }
      };

      const handleNextQuestion = () => {
        if (currentQIndex < activeQuizQuestions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
          setUserAnswerInput('');
          setSelectedChoice(null);
          setQuizSubmitted(false);
          setIsAnswerCorrect(false);
          setShowHint(false);
        } else {
          if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          setQuizResult({ total: activeQuizQuestions.length, earned: activeQuizQuestions.length * 10 });
        }
      };

      const handleSetFamilySyncCode = (e) => {
        e.preventDefault();
        const clean = syncInputCode.trim();
        if (!clean) return;
        setAppState(prev => ({ ...prev, familySyncCode: clean }));
        alert(`☁️ あいことば「${clean}」でクラウドリアルタイム同期を開始しました！`);
      };

      const handleUnlockParent = (e) => {
        e.preventDefault();
        if (parentPinInput === appState.parentPin) setParentUnlocked(true);
        else alert('暗証番号が異なります（初期番号：0410）');
      };

      return (
        <div className="app-viewport">
          <header className="card-large main-header">
            <div className="header-top-row">
              <div className="app-brand">
                <div className="brand-icon">🎒</div>
                <div>
                  <h1 className="brand-title">岡山中受ナビ</h1>
                  <span className="brand-sub">操山中・大安寺中等受検 ＆ 小学生教科学習</span>
                </div>
              </div>

              {/* クラウド同期ステータス ＆ 受講者切替 */}
              <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                <span className="badge" style={{ background: appState.familySyncCode ? '#e6fffa' : '#f1f5f9', color: appState.familySyncCode ? '#047857' : '#64748b', border: '1px solid #cbd5e1' }}>
                  ☁️ {appState.familySyncCode ? `同期中: ${appState.familySyncCode}` : 'ローカル動作用'}
                </span>

                <button
                  className={`btn ${appState.activeProfileId === 'minato' ? 'btn-primary' : 'btn-secondary'}`}
                  onClick={() => handleSwitchProfile('minato')}
                  style={{ borderRadius: '999px', padding: '6px 16px' }}
                >
                  👧 みなとちゃん（小1）
                </button>
                <button
                  className={`btn ${appState.activeProfileId === 'yuzu' ? 'btn-primary' : 'btn-secondary'}`}
                  onClick={() => handleSwitchProfile('yuzu')}
                  style={{ borderRadius: '999px', padding: '6px 16px' }}
                >
                  👧 ゆずちゃん（小4）
                </button>
              </div>
            </div>

            <div className="nav-menu-bar">
              {[
                { id: 'home', label: '🏠 ホーム' },
                { id: 'advance', label: '🚀 先取り' },
                { id: 'math', label: '📐 算数・筆算' },
                { id: 'kanji', label: '✏️ 漢字・国語' },
                { id: 'science', label: '🧪 理科' },
                { id: 'social', label: '🗾 社会' },
                { id: 'revenge', label: '🔥 リベンジ' },
                { id: 'progress', label: '📊 進捗・お財布' },
                { id: 'guide', label: '📖 志望校ガイド' },
                { id: 'parent', label: '🔒 保護者エリア' }
              ].map(m => (
                <button
                  key={m.id}
                  className={`nav-menu-item ${appState.activeTab === m.id ? 'active' : ''}`}
                  onClick={() => { setAppState(prev => ({ ...prev, activeTab: m.id })); setQuizActive(false); }}
                >
                  {m.label}
                </button>
              ))}
            </div>
          </header>

          {quizActive ? (
            <div className="card-large" style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              {!quizResult ? (
                <>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '8px' }}>
                    <span className="badge" style={{ background: 'var(--primary-bg)', color: 'var(--primary)' }}>
                      問題 {currentQIndex + 1} / {activeQuizQuestions.length}
                    </span>
                    <button className="btn btn-secondary" onClick={() => setQuizActive(false)}>演習をやめる</button>
                  </div>

                  {/* 全問題 自由選択バー (問題開放) */}
                  <div style={{ display: 'flex', gap: '6px', overflowX: 'auto', padding: '6px 0', borderBottom: '1px solid #e2e8f0' }}>
                    <span style={{ fontSize: '0.8rem', fontWeight: 'bold', alignSelf: 'center', whiteSpace: 'nowrap', color: 'var(--color-text-sub)' }}>
                      自由選択:
                    </span>
                    {activeQuizQuestions.map((q, idx) => (
                      <button
                        key={q.id || idx}
                        className={`btn ${currentQIndex === idx ? 'btn-primary' : 'btn-secondary'}`}
                        onClick={() => {
                          setCurrentQIndex(idx);
                          setUserAnswerInput('');
                          setSelectedChoice(null);
                          setQuizSubmitted(false);
                          setIsAnswerCorrect(false);
                        }}
                        style={{ padding: '4px 12px', minHeight: '36px', fontSize: '0.82rem', borderRadius: '10px' }}
                      >
                        問{idx + 1}
                      </button>
                    ))}
                  </div>

                  <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                    {activeQuizQuestions[currentQIndex]?.difficulty === 'basic' && (
                      <span className="badge" style={{ background: '#ecfdf5', color: '#047857', border: '1px solid #6ee7b7' }}>🟢 基礎</span>
                    )}
                    {activeQuizQuestions[currentQIndex]?.difficulty === 'intermediate' && (
                      <span className="badge" style={{ background: '#fffbe3', color: '#b45309', border: '1px solid #fde047' }}>🟡 中級</span>
                    )}
                    {activeQuizQuestions[currentQIndex]?.difficulty === 'advanced' && (
                      <span className="badge" style={{ background: '#fff1f2', color: '#be123c', border: '1px solid #fda4af' }}>🔴 応用・受検</span>
                    )}
                    <h3 style={{ fontSize: '1.25rem', fontWeight: '900', margin: 0 }}>
                      <FuriganaText text={activeQuizQuestions[currentQIndex]?.rubiedTitle || activeQuizQuestions[currentQIndex]?.title} showFurigana={appState.showFurigana} />
                    </h3>
                  </div>

                  <div style={{ background: '#ffffff', padding: '16px', borderRadius: '18px', border: '1.5px solid #e2e8f0' }}>
                    <FuriganaText text={activeQuizQuestions[currentQIndex]?.rubiedQuestion || activeQuizQuestions[currentQIndex]?.question} showFurigana={appState.showFurigana} />
                    <DiagramViewer type={activeQuizQuestions[currentQIndex]?.diagram} />

                    {/* ヒント機能ボタン ＆ ヒントエリア */}
                    <div style={{ marginTop: '10px' }}>
                      <button
                        type="button"
                        className="btn btn-secondary"
                        style={{ fontSize: '0.85rem', padding: '6px 14px', borderRadius: '999px', background: '#fffbe3', color: '#b45309', border: '1px solid #f59e0b' }}
                        onClick={() => setShowHint(!showHint)}
                      >
                        💡 {showHint ? 'ヒントをかくす' : 'ヒントを見る'}
                      </button>

                      {showHint && (
                        <div className="card-std" style={{ background: '#fefce8', border: '1.5px dashed #f59e0b', marginTop: '8px', padding: '12px' }}>
                          <strong style={{ color: '#b45309', fontSize: '0.9rem' }}>💡 【解き方のヒント】:</strong>
                          <p style={{ fontSize: '0.92rem', color: '#78350f', marginTop: '4px', lineHeight: '1.6' }}>
                            {activeQuizQuestions[currentQIndex]?.explanation ? `提示された数や図形をよく観察しよう！「${activeQuizQuestions[currentQIndex]?.explanation.substring(0, 32)}...」` : '問題の条件や図をよく観察して、順序立てて考えてみよう！'}
                          </p>
                        </div>
                      )}
                    </div>
                  </div>

                  {activeQuizQuestions[currentQIndex]?.type === 'choice' && (
                    <div style={{ display: 'grid', gap: '10px' }}>
                      {activeQuizQuestions[currentQIndex].options.map((opt, idx) => (
                        <button
                          key={idx}
                          className={`btn ${selectedChoice === opt ? 'btn-primary' : 'btn-secondary'}`}
                          onClick={() => setSelectedChoice(opt)}
                          disabled={quizSubmitted}
                          style={{ justifyContent: 'flex-start', textAlign: 'left' }}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  )}

                  {activeQuizQuestions[currentQIndex]?.type === 'numeric' && (
                    <div>
                      <label style={{ fontSize: '0.9rem', fontWeight: 'bold', display: 'block', marginBottom: '6px' }}>
                        数字を入力（全角数字でもOK）:
                      </label>
                      <input
                        type="text"
                        inputMode="numeric"
                        className="card-std"
                        style={{ width: '100%', fontSize: '1.4rem', fontWeight: '900', textAlign: 'center' }}
                        value={userAnswerInput}
                        onChange={(e) => setUserAnswerInput(e.target.value)}
                        placeholder="例: 823 または ８２３"
                        disabled={quizSubmitted}
                      />
                    </div>
                  )}

                  {activeQuizQuestions[currentQIndex]?.type === 'essay' && (
                    <div>
                      <textarea
                        className="card-std"
                        style={{ width: '100%', height: '100px', fontSize: '1rem' }}
                        value={userAnswerInput}
                        onChange={(e) => setUserAnswerInput(e.target.value)}
                        placeholder="理由や自分の考えを書いてみよう！"
                        disabled={quizSubmitted}
                      />
                    </div>
                  )}

                  {!quizSubmitted ? (
                    <button className="btn btn-primary" onClick={handleCheckAnswer} style={{ marginTop: '10px' }}>
                      答え合わせする
                    </button>

                      <div style={{ background: '#ffffff', padding: '12px 14px', borderRadius: '12px', border: '1px stroke #cbd5e1' }}>

                        <div style={{ marginTop: '6px', fontSize: '0.85rem', color: '#1e293b', lineHeight: '1.75' }}>
                          <p>👧 <strong>前期生（中1）の声:</strong> 「一人ひとりにChromebookが配られて、グループでスライドを作ったりクイズ大会をする授業がめちゃくちゃ楽しいです！北長瀬駅から近いから通学もラクラク！」</p>
                          <p style={{ marginTop: '4px' }}>👨‍👩‍👧 <strong>保護者様の声:</strong> 『チーム大安寺』の名の通り先生方の面倒見がとても良く、質問教室や補習で寄り添ってくれます。いじめ対策アプリなどの生活面の安心感も選んで良かった理由です。」</p>
                        </div>
                      </div>
                    </div>

                    <div style={{ display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap', marginTop: '4px' }}>
                      <a
                        href="https://www.daianji.okayama-c.ed.jp/"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="btn btn-primary"
                        style={{ textDecoration: 'none', background: 'var(--color-teal)', fontSize: '0.9rem', padding: '8px 18px' }}
                      >
                        🔗 大安寺中等教育学校 公式HPを見る ➔
                      </a>
                    </div>
                  </div>

                  {/* 県公式 過去問PDFダウンロードリンク */}
                  <div className="card-std" style={{ background: '#f0f9ff', border: '1.5px solid #0284c7' }}>
                    <h4 style={{ color: '#0369a1', fontSize: '1.1rem', fontWeight: '900' }}>📄 岡山県教育委員会 公式・過去の適性検査問題（PDF）</h4>
                    <p style={{ fontSize: '0.88rem', color: '#0c4a6e', marginTop: '4px' }}>
                      岡山県庁公式Webサイトにて公開されている直近3年分（R8, R7, R6年度）の適性検査問題・正答例・結果概要への直接リンクです。
                    </p>
                    <div style={{ display: 'flex', gap: '10px', marginTop: '12px', flexWrap: 'wrap' }}>
                      <a
                        href="https://www.pref.okayama.jp/page/848225.html"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="btn btn-primary"
                        style={{ background: '#0284c7', fontSize: '0.88rem', padding: '8px 16px', textDecoration: 'none' }}
                      >
                        🔗 岡山県公式 適性検査問題公開ページ ➔
                      </a>
                      <a
                        href="https://www.daianji-ss.okayama-c.ed.jp/tekisei/"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="btn btn-secondary"
                        style={{ fontSize: '0.88rem', padding: '8px 16px', textDecoration: 'none' }}
                      >
                        🔗 大安寺中等 過去の適性検査ページ ➔
                      </a>
                    </div>
                  </div>

                  {/* 受検対策のアドバイス */}
                  <div className="card-std" style={{ background: '#fffbeb', border: '1.5px dashed #f59e0b' }}>
                    <h4 style={{ color: '#b45309', fontSize: '1.1rem', fontWeight: '900' }}>💡 公立中高一貫校 適性検査の学習ポイント</h4>
                    <ul style={{ paddingLeft: '20px', marginTop: '8px', fontSize: '0.92rem', lineHeight: '1.7', color: '#78350f' }}>
                      <li><strong>単なる暗記ではなく思考力・記述力が鍵:</strong> なぜそう言えるのか、自分の言葉で理由を説明する練習を重ねましょう。</li>
                      <li><strong>グラフや表の読み取り:</strong> 岡山の気候や人口、地域の話題を問題の資料から正しく分析する力を養います。</li>
                      <li><strong>計算力の正確さ:</strong> 算数の筆算や割合・規則性の問題をミスなく解くスピードが基盤になります。</li>
                    </ul>
                  </div>
                </div>
              )}

              {appState.activeTab === 'parent' && (
                <div className="card-large">
                  <h2>🔒 保護者専用エリア</h2>
                  {!parentUnlocked ? (
                    <form onSubmit={handleUnlockParent} style={{ marginTop: '16px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      <label style={{ fontWeight: 'bold' }}>暗証番号を入力してください（初期: 0410）:</label>
                      <input
                        type="password"
                        className="card-std"
                        style={{ width: '200px', fontSize: '1.2rem', textAlign: 'center' }}
                        value={parentPinInput}
                        onChange={(e) => setParentPinInput(e.target.value)}
                      />
                      <button type="submit" className="btn btn-primary" style={{ width: '200px' }}>ロック解除</button>
                    </form>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '20px', marginTop: '16px' }}>
                      {/* クラウド自動同期・あいことば設定 */}
                      <div className="card-std" style={{ background: '#f0fdf4', border: '1.5px solid #10b981' }}>
                        <h3 style={{ color: '#047857' }}>☁️ クラウド自動同期（マルチデバイス共有）設定</h3>
                        <p style={{ fontSize: '0.88rem', color: '#065f46', marginTop: '4px' }}>
                          スマホ・タブレット・PCで「同じあいことば（例：okayama-family）」を設定すると、1秒未満で自動同期されます！
                        </p>
                        <form onSubmit={handleSetFamilySyncCode} style={{ display: 'flex', gap: '10px', marginTop: '10px', flexWrap: 'wrap' }}>
                          <input
                            type="text"
                            className="card-std"
                            style={{ flex: 1, minWidth: '200px', padding: '10px 14px' }}
                            placeholder="例: okayama-2026"
                            value={syncInputCode}
                            onChange={(e) => setSyncInputCode(e.target.value)}
                          />
                          <button type="submit" className="btn btn-primary" style={{ background: '#10b981' }}>あいことばを登録</button>
                        </form>
                        {appState.familySyncCode && (
                          <p style={{ marginTop: '8px', fontSize: '0.85rem', fontWeight: 'bold', color: '#047857' }}>
                            現在のあいことば: 「{appState.familySyncCode}」
                          </p>
                        )}
                      </div>

                      <div className="card-std">
                        <h3>💬 子どもへの応援メッセージ変更</h3>
                        <input
                          type="text"
                          className="card-std"
                          style={{ width: '100%', marginTop: '8px' }}
                          value={appState.parentMessage}
                          onChange={(e) => setAppState(prev => ({ ...prev, parentMessage: e.target.value }))}
                        />
                      </div>
                      <button className="btn btn-secondary" onClick={() => setParentUnlocked(false)}>保護者エリアを施錠</button>
                    </div>
                  )}
                </div>
              )}
            </>
          )}

          {/* 📖 詳しい解き方・解説 モーダルウィンドウ */}
          {selectedExplanationModal && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(15, 23, 42, 0.65)', backdropFilter: 'blur(4px)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 9999, padding: '16px' }}>
              <div className="card-large" style={{ background: '#ffffff', width: '100%', maxWidth: '600px', maxHeight: '90vh', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '16px', boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.3)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '2px solid #e2e8f0', paddingBottom: '12px' }}>
                  <h3 style={{ fontSize: '1.25rem', color: 'var(--primary)', fontWeight: '900' }}>
                    📖 解き方と詳しい解説
                  </h3>
                  <button className="btn btn-secondary" style={{ padding: '4px 12px', minHeight: '32px' }} onClick={() => setSelectedExplanationModal(null)}>
                    ✖ 閉じる
                  </button>
                </div>

                <div style={{ background: '#f8fafc', padding: '14px', borderRadius: '14px', border: '1px solid #cbd5e1' }}>
                  <span className="badge" style={{ background: '#eff6ff', color: '#1d4ed8' }}>
                    {selectedExplanationModal.unit || selectedExplanationModal.title}
                  </span>
                  <h4 style={{ marginTop: '8px', fontSize: '1.1rem', fontWeight: '800' }}>
                    {selectedExplanationModal.question}
                  </h4>
                  <DiagramViewer type={selectedExplanationModal.diagram} />
                </div>

                <div className="card-std" style={{ background: '#ecfdf5', border: '1.5px solid #10b981' }}>
                  <strong style={{ color: '#047857', fontSize: '1rem' }}>🎯 正解:</strong>
                  <p style={{ fontSize: '1.2rem', fontWeight: '900', color: '#065f46', marginTop: '2px' }}>
                    {selectedExplanationModal.correctAnswer}
                  </p>
                </div>

                <div className="card-std" style={{ background: '#fffbe3', border: '1.5px solid #f59e0b' }}>
                  <strong style={{ color: '#b45309', fontSize: '1rem' }}>💡 ステップ別 解き方・考え方ポイント:</strong>
                  <p style={{ fontSize: '0.95rem', color: '#78350f', marginTop: '6px', lineHeight: '1.7', whiteSpace: 'pre-line' }}>
                    {selectedExplanationModal.explanation}
                  </p>
                </div>

                <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '8px' }}>
                  <button className="btn btn-primary" onClick={() => setSelectedExplanationModal(null)}>
                    理解できた！ 演習に戻る ➔
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <OkayamaChujuApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
