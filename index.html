  <style>
    /* ----------------------------------------------------
       岡山中受ナビ - デザインシステム & レスポンシブCSS
       ---------------------------------------------------- */
    :root {
      --font-main: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
      --font-number: 'Plus Jakarta Sans', var(--font-main);

      /* カラー定義 */
      --color-blue: #2563eb;
      --color-teal: #0d9488;
      
      /* 受講者カラー */
      --color-minato: #ec4899;
      --bg-minato: #fdf2f8;
      
      --color-yuzu: #8b5cf6;
      --bg-yuzu: #f3e8ff;

      --color-accent: #f59e0b;
      --bg-accent: #fef3c7;

      /* アクティブテーマ (デフォルト：ブルー) */
      --primary: var(--color-blue);
      --primary-bg: #eff6ff;
      --primary-border: rgba(37, 99, 235, 0.2);

      --color-text-main: #1e293b;
      --color-text-sub: #64748b;
      --color-success: #10b981;
      --color-danger: #ef4444;

      /* 角丸ルールの徹底 */
      --radius-card: 20px;
      --radius-large-card: 28px;
      --radius-btn: 16px;

      /* ガラスマフィズムとシャドウ */
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.6);
      --shadow-glass: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 16px 36px -4px rgba(0, 0, 0, 0.09), 0 6px 16px rgba(0, 0, 0, 0.04);

      /* タッチ操作 & iOS セーフエリア */
      --min-tap: 48px;
      --safe-bottom: max(16px, env(safe-area-inset-bottom, 16px));
    }

    /* テーマ切り替え用CSSクラス */
    body.theme-minato {
      --primary: var(--color-minato);
      --primary-bg: var(--bg-minato);
      --primary-border: rgba(236, 72, 153, 0.25);
    }
    body.theme-yuzu {
      --primary: var(--color-yuzu);
      --primary-bg: var(--bg-yuzu);
      --primary-border: rgba(139, 92, 246, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-main);
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      background-attachment: fixed;
      color: var(--color-text-main);
      line-height: 1.6;
      font-size: 16px;
    }

    /* ルビ表示スタイル */
    ruby {
      ruby-position: over;
    }
    rt {
      font-size: 0.65em;
      font-weight: 800;
      user-select: none;
    }
    body.theme-minato rt { color: var(--color-minato); }
    body.theme-yuzu rt { color: var(--color-blue); }

    /* レイアウト構造 */
    .app-viewport {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: calc(var(--safe-bottom) + 90px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.4s ease-out;
    }

    /* カード・ボタン共通スタイル */
    .card-std {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-card);
      border: 1.5px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
      padding: 20px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-large {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-large-card);
      border: 1.5px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
      padding: 26px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-hoverable:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .btn {
      min-height: var(--min-tap);
      min-width: var(--min-tap);
      padding: 12px 22px;
      border-radius: var(--radius-btn);
      border: none;
      font-family: var(--font-main);
      font-weight: 800;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }
    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--color-text-main);
      border: 1.5px solid rgba(0, 0, 0, 0.1);
    }
    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    /* アニメーションキーフレーム */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popCorrect {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }

    /* エラーバウンダリ表示 */
    .error-fallback-container {
      max-width: 500px;
      margin: 60px auto;
      padding: 32px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;

    /* ナビゲーションヘッダー */
    .main-header {
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-bottom: 3px solid var(--primary-border);
    }
    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .app-brand {
      display: flex;
      align-items: center;

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 16px;

      display: flex;
      align-items: center;

    .brand-sub {
      font-size: 0.75rem;
      color: var(--color-text-sub);
      font-weight: 700;

    .nav-menu-bar {
      display: flex;
      gap: 8px;

      padding-bottom: 4px;

    .nav-menu-item {

      border-radius: 14px;

      background: #ffffff;

      font-size: 0.9rem;

    .nav-menu-item.active {
      background: var(--primary);

      .card-large { padding: 18px; border-radius: 22px; }
      .card-std { padding: 14px; border-radius: 18px; }
    }
  </style>
</head>

  <!-- React 18 内部スクリプト (Babel トランスパイル) -->
  <script type="text/babel">
    const { useState, useEffect, Component } = React;

    // ----------------------------------------------------
    // 安全な LocalStorage アクセスユーティリティ (堅牢性確保)
    // ----------------------------------------------------
    const STORAGE_KEY = 'okayama_chuju_navi_v2';

    const defaultInitialState = {
      activeProfileId: 'minato', // minato or yuzu
      activeGrade: '1',
      activeTab: 'home',
      showFurigana: true,
      parentPin: '0410',
      parentMessage: '今日も一歩ずつがんばろう！できたことを大切にしよう😊',
      parentRewardName: 'お菓子・図書カード',
      
      // 受講者別独立データ
      students: {
        minato: {
          id: 'minato',
          name: 'みなとちゃん',
          gradeStr: '小学1年生',
          gradeNum: 1,
          avatar: '👧',
          level: 1,
          exp: 0,
          step: 1,
          wallet: 0, // 現在の貯金額 (円)
          totalEarned: 0,
          unusedTickets: 0,
          usedTickets: 0,
          badges: ['はじめの一歩'],
          completedWeeks: [1],
          seasonalCompleted: { summer: false, winter: false, spring: false }
        },
        yuzu: {
          id: 'yuzu',
          name: 'ゆずちゃん',
          gradeStr: '小学4年生',
          gradeNum: 4,
          avatar: '👧',
          level: 1,
          exp: 0,
          step: 1,
          wallet: 0,
          totalEarned: 0,
          unusedTickets: 0,
          usedTickets: 0,
          badges: ['はじめの一歩', '操山・大安寺チャレンジャー'],
          completedWeeks: [1],
          seasonalCompleted: { summer: false, winter: false, spring: false }
        }
      },
      // 学習演習履歴
      history: [],
      // オリジナルカスタマイズ問題集
      customQuestions: []
    };

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultInitialState;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return defaultInitialState;
        
        // 最低限のプロパティ保護
        return {
          ...defaultInitialState,
          ...parsed,
          students: {
            minato: { ...defaultInitialState.students.minato, ...(parsed.students?.minato || {}) },
            yuzu: { ...defaultInitialState.students.yuzu, ...(parsed.students?.yuzu || {}) }
          }
        };
      } catch (err) {
        console.warn('LocalStorage load error, returning initial defaults:', err);
        return defaultInitialState;
      }
    }

    function saveStateToStorage(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('LocalStorage save error:', err);
      }
    }

    // 全角数字 -> 半角数字 変換関数
    function normalizeNumber(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xfee0))
                .replace(/．/g, '.')
                .trim();
    }

    // ----------------------------------------------------
    // React ErrorBoundary (万が一のエラー時も白画面を防止)
    // ----------------------------------------------------
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorInfo: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true };
      }

      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught an error:', error, errorInfo);
      }

      handleReset = () => {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        window.location.reload();
      };

      render() {
        if (this.state.hasError) {
          return (
            <div className="error-fallback-container">
              <h2 style={{ color: 'var(--color-danger)', fontSize: '1.4rem' }}>⚠️ 予期しない問題が発生しました</h2>
              <p style={{ color: 'var(--color-text-sub)', fontSize: '0.95rem' }}>
                画面描画を復旧させるため、安全にデータを初期化して再起動します。
              </p>
              <button className="btn btn-primary" onClick={this.handleReset} style={{ margin: '10px auto' }}>
                🔄 キャッシュをクリアして再起動
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ----------------------------------------------------
    // FuriganaText コンポーネント (ひらがなルビ自動表示)
    // ----------------------------------------------------
    const FuriganaText = ({ text, showFurigana = true, isMinato = true }) => {
      if (!text) return null;
      if (!showFurigana) {
        // ルビタグ除去
        const clean = text.replace(/<ruby>(.*?)<rt>.*?<\/rt><\/ruby>/g, '$1');
        return <span>{clean}</span>;
      }
      return <span dangerouslySetInnerHTML={{ __html: text }} />;
    };

    // ----------------------------------------------------
    // サンプル学習問題データ (全教科・適性検査・筆算対応)
    // ----------------------------------------------------
    const SAMPLE_QUESTIONS = [
      {
        id: 'q_m1',

    // ----------------------------------------------------
    // Main App React Component
    // ----------------------------------------------------
    function OkayamaChujuApp() {
      const [appState, setAppState] = useState(loadSavedState);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [parentPinInput, setParentPinInput] = useState('');
      const [parentUnlocked, setParentUnlocked] = useState(false);
      const [quizActive, setQuizActive] = useState(false);
      const [activeQuizQuestions, setActiveQuizQuestions] = useState([]);

      const [userAnswerInput, setUserAnswerInput] = useState('');
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [showHint, setShowHint] = useState(false);
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [isAnswerCorrect, setIsAnswerCorrect] = useState(false);
      const [quizResult, setQuizResult] = useState(null);
      const [seasonalTab, setSeasonalTab] = useState('summer');

      // State 自動保存
      useEffect(() => {
        saveStateToStorage(appState);
      }, [appState]);

      const activeProfile = appState.students[appState.activeProfileId];
      const isMinato = appState.activeProfileId === 'minato';

      // テーマクラス適用
      useEffect(() => {
        document.body.className = isMinato ? 'theme-minato' : 'theme-yuzu';
      }, [isMinato]);

      // プロフィール切替
      const handleSwitchProfile = (profId) => {
        setAppState(prev => ({
          ...prev,
          activeProfileId: profId,
          activeGrade: profId === 'minato' ? '1' : '4',
          showFurigana: profId === 'minato' ? true : prev.showFurigana
        }));
      };

      // 星・お小遣い・経験値獲得
      const rewardStudent = (amountEarned, expGained = 20) => {
        setAppState(prev => {
          const currentStud = prev.students[prev.activeProfileId];
          const newWallet = currentStud.wallet + amountEarned;
          const newTotalEarned = currentStud.totalEarned + amountEarned;
          const newExp = currentStud.exp + expGained;
          const newLevel = Math.floor(newExp / 100) + 1;
          const newStep = Math.min(50, currentStud.step + Math.floor(expGained / 20));

          // 100円到達でチケット発行
          let newUnusedTickets = currentStud.unusedTickets;
          if (Math.floor(newWallet / 100) > Math.floor(currentStud.wallet / 100)) {
            newUnusedTickets += 1;
          }

          return {
            ...prev,
            students: {
              ...prev.students,
              [prev.activeProfileId]: {
                ...currentStud,
                wallet: newWallet,
                totalEarned: newTotalEarned,
                exp: newExp,
                level: newLevel,
                step: newStep,
                unusedTickets: newUnusedTickets
              }
            }
          };
        });
      };

      // ドリル開始
      const startDrillCategory = (subjectFilter) => {
        let filtered = SAMPLE_QUESTIONS.filter(q => {
          if (subjectFilter === 'all') return true;
          if (subjectFilter === 'aptitude') return q.subject === 'aptitude';
          return q.subject === subjectFilter;
        });

        if (appState.customQuestions && appState.customQuestions.length > 0) {
          const customFiltered = appState.customQuestions.filter(q => subjectFilter === 'all' || q.subject === subjectFilter);
          filtered = [...filtered, ...customFiltered];
        }

        if (filtered.length === 0) filtered = SAMPLE_QUESTIONS;

        setActiveQuizQuestions(filtered);
        setCurrentQIndex(0);
        setUserAnswerInput('');
        setSelectedChoice(null);
        setShowHint(false);
        setQuizSubmitted(false);
        setIsAnswerCorrect(false);
        setQuizResult(null);
        setQuizActive(true);
      };

      // クイズ回答チェック
      const handleCheckAnswer = () => {
        if (quizSubmitted) return;

        const currentQ = activeQuizQuestions[currentQIndex];
        let correct = false;

        if (currentQ.type === 'choice') {
          correct = selectedChoice === currentQ.correctAnswer;
        } else if (currentQ.type === 'numeric') {
          const normInput = normalizeNumber(userAnswerInput);
          const normCorrect = normalizeNumber(currentQ.correctAnswer);
          correct = normInput === normCorrect;
        } else if (currentQ.type === 'essay') {
          correct = userAnswerInput.trim().length >= 5; // 記述形式は意欲記述でクリア
        }

        setQuizSubmitted(true);
        setIsAnswerCorrect(correct);

        if (correct) {
          rewardStudent(10, 25); // 1問正解で10円＆25EXP
        }
      };

      // 次の問題へ
      const handleNextQuestion = () => {
        if (currentQIndex < activeQuizQuestions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
          setUserAnswerInput('');
          setSelectedChoice(null);
          setShowHint(false);
          setQuizSubmitted(false);
          setIsAnswerCorrect(false);
        } else {
          // クイズ完了
          if (window.confetti) {
            window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }

          const earned = activeQuizQuestions.length * 10;
          setQuizResult({
            total: activeQuizQuestions.length,
            earned: earned
          });
        }
      };

      // 保護者エリア認証
      const handleUnlockParent = (e) => {
        e.preventDefault();
        if (parentPinInput === appState.parentPin) {
          setParentUnlocked(true);
        } else {
          alert('暗証番号が異なります（初期番号：0410）');
        }
      };

                <div className="brand-icon">🎒</div>
                <div>

                </div>
              </div>

              {/* 受講者切替ボタン */}

                  className={`btn ${appState.activeProfileId === 'minato' ? 'btn-primary' : 'btn-secondary'}`}
                  onClick={() => handleSwitchProfile('minato')}
                  style={{ borderRadius: '999px', padding: '6px 16px' }}
                >
                  👧 みなとちゃん（小1）
                </button>
                <button
                  className={`btn ${appState.activeProfileId === 'yuzu' ? 'btn-primary' : 'btn-secondary'}`}
                  onClick={() => handleSwitchProfile('yuzu')}
                  style={{ borderRadius: '999px', padding: '6px 16px' }}
                >
                  👧 ゆずちゃん（小4）
                </button>
              </div>
            </div>

            {/* ナビゲーションメニュー */}
            <div className="nav-menu-bar">
              {[
                { id: 'home', label: '🏠 ホーム' },
                { id: 'advance', label: '🚀 先取り' },
                { id: 'math', label: '📐 算数・筆算' },
                { id: 'kanji', label: '✏️ 漢字・国語' },
                { id: 'progress', label: '📊 進捗・お財布' },
                { id: 'guide', label: '📖 志望校ガイド' },
                { id: 'parent', label: '🔒 保護者エリア' }
              ].map(m => (
                <button
                  key={m.id}
                  className={`nav-menu-item ${appState.activeTab === m.id ? 'active' : ''}`}
                  onClick={() => { setAppState(prev => ({ ...prev, activeTab: m.id })); setQuizActive(false); }}

                  {m.label}
                </button>
              ))}

                      問題 {currentQIndex + 1} / {activeQuizQuestions.length}

                    <button className="btn btn-secondary" onClick={() => setQuizActive(false)}>演習をやめる</button>
                  </div>

                  <h3 style={{ fontSize: '1.25rem', fontWeight: '900' }}>
                    <FuriganaText text={activeQuizQuestions[currentQIndex]?.rubiedTitle || activeQuizQuestions[currentQIndex]?.title} showFurigana={appState.showFurigana} />
                  </h3>

                  <div style={{ background: '#ffffff', padding: '16px', borderRadius: '18px', border: '1.5px solid #e2e8f0' }}>

                  </div>

                  {/* 選択問題 */}
                  {activeQuizQuestions[currentQIndex]?.type === 'choice' && (
                    <div style={{ display: 'grid', gap: '10px' }}>
                      {activeQuizQuestions[currentQIndex].options.map((opt, idx) => (
                        <button
                          key={idx}

                          disabled={quizSubmitted}

                          {opt}
                        </button>
                      ))}
                    </div>
                  )}

                  {/* 数値問題（全角・半角変換対応） */}

                    <div>
                      <label style={{ fontSize: '0.9rem', fontWeight: 'bold', display: 'block', marginBottom: '6px' }}>

                        inputMode="numeric"

                    </div>

                  {/* 記述問題 */}
                  {activeQuizQuestions[currentQIndex]?.type === 'essay' && (

                      <textarea

                      <p style={{ marginTop: '6px', fontWeight: 'bold' }}>
                        【解説】{activeQuizQuestions[currentQIndex]?.explanation}

                      <button className="btn btn-primary" onClick={handleNextQuestion} style={{ marginTop: '12px' }}>
                        {currentQIndex < activeQuizQuestions.length - 1 ? '次の問題へ ➔' : '結果を見る 🏆'}

                    </div>

                  <button className="btn btn-primary" onClick={() => setQuizActive(false)} style={{ margin: '0 auto' }}>
                    ホームへ戻る
                  </button>
                </div>
              )}
            </div>

            <>

              {appState.activeTab === 'home' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  {/* 2. 受講者プロフィール ＆ 保護者メッセージ */}

                      <div style={{ fontSize: '3.5rem' }}>{activeProfile.avatar}</div>

                  <div className="card-large card-hoverable" style={{ background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)', color: '#ffffff' }} onClick={() => startDrillCategory('aptitude')}>

              {appState.activeTab === 'kanji' && (
                <div className="card-large" style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <h2 style={{ color: 'var(--primary)' }}>✏️ 漢字・国語ドリル</h2>
                  <p>学年ごとの読み・書き、同音異義語、語彙力を鍛えよう！</p>
                  <button className="btn btn-primary" onClick={() => startDrillCategory('japanese')}>国語ドリルをスタート！</button>
                </div>
              )}

              {/* 進捗・お財布タブ */}
              {appState.activeTab === 'progress' && (
                <div className="card-large" style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  <h2>💰 {activeProfile.name} のお財布・貯金通帳</h2>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '12px' }}>
                    <div className="card-std" style={{ background: '#fef3c7', border: '1.5px solid #f59e0b' }}>
                      <span style={{ fontSize: '0.85rem', fontWeight: 'bold' }}>現在の貯金額</span>
                      <p style={{ fontSize: '1.8rem', fontWeight: '900', color: '#b45309' }}>{activeProfile.wallet} 円</p>
                    </div>
                    <div className="card-std">
                      <span style={{ fontSize: '0.85rem', fontWeight: 'bold' }}>未使用お小遣いチケット</span>
                      <p style={{ fontSize: '1.8rem', fontWeight: '900', color: 'var(--primary)' }}>🎟️ {activeProfile.unusedTickets} 枚</p>
                    </div>
                  </div>
                </div>
              )}

              {/* 志望校ガイドタブ */}
              {appState.activeTab === 'guide' && (
                <div className="card-large" style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <h2>📖 岡山市 公立中高一貫校 志望校ガイド</h2>
                  <div className="card-std">
                    <h3 style={{ color: 'var(--color-blue)' }}>🏫 岡山県立操山中学校</h3>
                    <p style={{ fontSize: '0.95rem', marginTop: '6px' }}>豊かな自然と歴史ある操山の環境で、高い論理的思考力と表現力を養う伝統校です。</p>
                  </div>
                  <div className="card-std">
                    <h3 style={{ color: 'var(--color-teal)' }}>🏫 岡山県立大安寺中等教育学校</h3>
                    <p style={{ fontSize: '0.95rem', marginTop: '6px' }}>6年間の一貫教育でグローバルリーダーを育てる、国際理解と適性検査対策が充実した進学校です。</p>
                  </div>
                </div>
              )}

              {/* 保護者専用エリア */}
              {appState.activeTab === 'parent' && (
                <div className="card-large">
                  <h2>🔒 保護者専用エリア</h2>
                  {!parentUnlocked ? (
                    <form onSubmit={handleUnlockParent} style={{ marginTop: '16px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      <label style={{ fontWeight: 'bold' }}>暗証番号を入力してください（初期: 0410）:</label>
                      <input
                        type="password"
                        className="card-std"
                        style={{ width: '200px', fontSize: '1.2rem', textAlign: 'center' }}
                        value={parentPinInput}
                        onChange={(e) => setParentPinInput(e.target.value)}
                      />
                      <button type="submit" className="btn btn-primary" style={{ width: '200px' }}>ロック解除</button>
                    </form>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', marginTop: '16px' }}>
                      <div className="card-std">
                        <h3>💬 子どもへの応援メッセージ変更</h3>
                        <input
                          type="text"
                          className="card-std"
                          style={{ width: '100%', marginTop: '8px' }}
                          value={appState.parentMessage}
                          onChange={(e) => setAppState(prev => ({ ...prev, parentMessage: e.target.value }))}
                        />
                      </div>
                      <button className="btn btn-secondary" onClick={() => setParentUnlocked(false)}>保護者エリアを施錠</button>
                    </div>
                  )}
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    // ----------------------------------------------------
    // アプリケーションレンダリング (ErrorBoundary 包摂)
    // ----------------------------------------------------
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <OkayamaChujuApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
